apiVersion: v1
kind: ServiceAccount
metadata:
  name: collector
  namespace: {{ .Env.BENCH_NAME }}
  annotations:
    iam.gke.io/gcp-service-account: gmp-prombench@{{ .Env.PROJECT_ID }}.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Env.BENCH_NAME }}:collector
rules:
- resources:
  - endpoints
  - nodes
  - nodes/metrics
  - pods
  - services
  apiGroups: [""]
  verbs: ["get", "list", "watch"]
- resources:
  - configmaps
  apiGroups: [""]
  verbs: ["get"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Env.BENCH_NAME }}:collector
roleRef:
  name: {{ .Env.BENCH_NAME }}:collector
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
subjects:
- name: collector
  namespace: {{ .Env.BENCH_NAME }}
  kind: ServiceAccount
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otap-collector-config
  namespace: {{ .Env.BENCH_NAME }}
data:
  config.yaml: |
    version: otel_dataflow/v1
    engine: {}
    groups:
      default:
        pipelines:
          main:
            policies:
              resources:
                core_allocation:
                  type: core_count
                  count: 1
              channel_capacity:
                control:
                  node: 100
                  pipeline: 100
                pdata: 256
            extensions:
              gcp_auth:
                type: urn:otel:extension:gcp_auth
                config: {}
            nodes:
              receiver:
                type: urn:otel:receiver:prometheus
                config:
                  job_name: avalanche
                  scrape_interval: 15s
                  scrape_timeout: 10s
                  metrics_path: /metrics
                  enable_open_metrics: true
                  max_data_points_per_batch: 200
                  dns_sd_targets:
                    - "avalanche.{{ .Env.BENCH_NAME }}.svc.cluster.local:9001"
              resource_attrs:
                type: urn:otel:processor:attribute
                config:
                  apply_to: ["resource"]
                  actions:
                    - action: upsert
                      key: "gcp.project_id"
                      value: "{{ .Env.PROJECT_ID }}"
                    - action: upsert
                      key: "cloud.account.id"
                      value: "{{ .Env.PROJECT_ID }}"
                    - action: upsert
                      key: "cloud.availability_zone"
                      value: "{{ .Env.ZONE }}"
                    - action: upsert
                      key: "cloud.platform"
                      value: "gcp_kubernetes_engine"
                    - action: upsert
                      key: "cloud.provider"
                      value: "gcp"
                    - action: upsert
                      key: "cloud.region"
                      value: "us-central1"
                    - action: upsert
                      key: "host.id"
                      value: "6738547723285439597"
                    - action: upsert
                      key: "host.name"
                      value: "gke-{{ .Env.CLUSTER_NAME }}-{{ .Env.BENCH_NAME }}-work-pool-96afa708-zj6n"
                    - action: upsert
                      key: "host.type"
                      value: "n2-highmem-8"
                    - action: upsert
                      key: "k8s.cluster.name"
                      value: "{{ .Env.CLUSTER_NAME }}"
                    - action: upsert
                      key: "k8s.namespace.name"
                      value: "{{ .Env.BENCH_NAME }}"
                    - action: upsert
                      key: "k8s.node.name"
                      value: "gke-{{ .Env.CLUSTER_NAME }}-{{ .Env.BENCH_NAME }}-work-pool-96afa708-zj6n"
                    - action: upsert
                      key: "k8s.pod.name"
                      value: "avalanche-5f78867584-42kpp"
                    - action: upsert
                      key: "k8s.pod.uid"
                      value: "3b2d4a0b-adcb-4d66-8989-b53e5831f11d"
                    - action: upsert
                      key: "k8s.pod.start_time"
                      value: "2026-11-04T17:20:00Z"
                    - action: upsert
                      key: "k8s.container.name"
                      value: "avalanche"
                    - action: upsert
                      key: "k8s.replicaset.name"
                      value: "avalanche-5f78867584"
                    - action: upsert
                      key: "k8s.deployment.name"
                      value: "avalanche"
                    - action: upsert
                      key: "server.address"
                      value: "avalanche-5f78867584-42kpp"
                    - action: upsert
                      key: "server.port"
                      value: "metrics"
                    - action: upsert
                      key: "url.scheme"
                      value: "http"
              datapoint_attrs:
                type: urn:otel:processor:attribute
                config:
                  apply_to: ["signal"]
                  actions:
                    - action: upsert
                      key: "pod"
                      value: "avalanche-5f78867584-42kpp"
                    - action: upsert
                      key: "container"
                      value: "avalanche"
                    - action: upsert
                      key: "top_level_controller_name"
                      value: "avalanche"
                    - action: upsert
                      key: "top_level_controller_type"
                      value: "Deployment"
                    - action: upsert
                      key: "otel_scope_name"
                      value: "github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver"
                    - action: upsert
                      key: "otel_scope_version"
                      value: "0.163.1"
                    - action: upsert
                      key: "exported_project_id"
                      value: "{{ .Env.PROJECT_ID }}"
                    - action: upsert
                      key: "exported_location"
                      value: "{{ .Env.ZONE }}"
                    - action: upsert
                      key: "exported_cluster"
                      value: "{{ .Env.CLUSTER_NAME }}"
                    - action: upsert
                      key: "exported_namespace"
                      value: "{{ .Env.BENCH_NAME }}"
                    - action: upsert
                      key: "exported_job"
                      value: "avalanche"
                    - action: upsert
                      key: "exported_instance"
                      value: "avalanche-5f78867584-42kpp:metrics"
              retry:
                type: urn:otel:processor:retry
                config:
                  initial_interval: 5s
                  max_interval: 30s
                  max_elapsed_time: 300s
                  multiplier: 1.5
              exporter:
                type: urn:otel:exporter:otlp_grpc
                capabilities:
                  bearer_token_provider: gcp_auth
                config:
                  grpc_endpoint: "https://telemetry.googleapis.com:443"
                  compression: gzip
            connections:
              - from: receiver
                to: resource_attrs
              - from: resource_attrs
                to: datapoint_attrs
              - from: datapoint_attrs
                to: retry
              - from: retry
                to: exporter
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: collector
  namespace: {{ .Env.BENCH_NAME }}
  labels:
    benchmark: {{ .Env.BENCH_NAME }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: collector
  template:
    metadata:
      labels:
        app: collector
        app.kubernetes.io/name: collector
        benchmark: {{ .Env.BENCH_NAME }}
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
        prometheus.io/path: /api/v1/metrics
    spec:
      serviceAccountName: collector
      automountServiceAccountToken: true
      containers:
      - name: otap-collector
        image: gcr.io/gpe-test-1/otap-df-engine:prometheus-receiver-gcp-auth-v0.2.0
        args:
          - "--config=/conf/config.yaml"
          - "--num-cores=1"
          - "--http-admin-bind=0.0.0.0:8888"
        env:
        - name: MALLOC_CONF
          value: "prof:true,prof_active:true,lg_prof_sample:19"
        volumeMounts:
        - name: otap-collector-config
          mountPath: /conf
          readOnly: true
        ports:
        - name: otap-ins # -ins, tells core Prometheus to scrape it.
          containerPort: 8888
        livenessProbe:
          httpGet:
            path: /api/v1/livez
            port: 8888
        readinessProbe:
          httpGet:
            path: /api/v1/readyz
            port: 8888
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - all
          privileged: false
      volumes:
      - name: otap-collector-config
        configMap:
          name: otap-collector-config
          items:
          - key: config.yaml
            path: config.yaml
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - arm64
                - amd64
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      tolerations:
      - effect: NoExecute
        operator: Exists
      - effect: NoSchedule
        operator: Exists
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        role: {{ .Env.BENCH_NAME }}-work
