apiVersion: v1
kind: ServiceAccount
metadata:
  name: collector
  namespace: {{ .Env.BENCH_NAME }}
  annotations:
    iam.gke.io/gcp-service-account: gmp-prombench@{{ .Env.PROJECT_ID }}.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Env.BENCH_NAME }}:collector
rules:
- resources:
  - endpoints
  - nodes
  - nodes/metrics
  - pods
  - services
  apiGroups: [""]
  verbs: ["get", "list", "watch"]
- resources:
  - configmaps
  apiGroups: [""]
  verbs: ["get"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Env.BENCH_NAME }}:collector
roleRef:
  name: {{ .Env.BENCH_NAME }}:collector
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
subjects:
- name: collector
  namespace: {{ .Env.BENCH_NAME }}
  kind: ServiceAccount
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: collector
  namespace: {{ .Env.BENCH_NAME }}
data:
  config.yaml: |
    global:
      scrape_interval: 2s
      scrape_timeout: 2s
      external_labels:
        collector: {{ .Env.BENCH_NAME }}
        project_id: {{ .Env.PROJECT_ID }}
        location: {{ .Env.ZONE }}
        cluster: {{ .Env.CLUSTER_NAME }}
    scrape_configs:
        - job_name: PodMonitoring/gmp/avalanche/metrics
          honor_timestamps: false
          scrape_interval: 15s
          scrape_timeout: 15s
          metrics_path: /metrics
          follow_redirects: true
          relabel_configs:
            - source_labels: [__meta_kubernetes_namespace]
              regex: {{ .Env.BENCH_NAME }}
              action: keep
            - source_labels: [__meta_kubernetes_pod_label_app]
              regex: avalanche
              action: keep
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: pod
              action: replace
            - source_labels: [__meta_kubernetes_pod_container_name]
              target_label: container
              action: replace
            - source_labels: [__meta_kubernetes_namespace]
              target_label: namespace
              action: replace
            - target_label: job
              replacement: avalanche
              action: replace
            - source_labels: [__meta_kubernetes_pod_phase]
              regex: (Failed|Succeeded)
              action: drop
            - target_label: project_id
              replacement: {{ .Env.PROJECT_ID }}
              action: replace
            - target_label: location
              replacement: {{ .Env.ZONE }}
              action: replace
            - target_label: cluster
              replacement: {{ .Env.CLUSTER_NAME }}
              action: replace
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: __tmp_instance
              action: replace
            - source_labels: [__meta_kubernetes_pod_controller_kind, __meta_kubernetes_pod_node_name]
              regex: DaemonSet;(.*)
              target_label: __tmp_instance
              replacement: $1
              action: replace
            - source_labels: [__meta_kubernetes_pod_container_port_name]
              regex: metrics
              action: keep
            - source_labels: [__tmp_instance, __meta_kubernetes_pod_container_port_name]
              regex: (.+);(.+)
              target_label: instance
              replacement: $1:$2
              action: replace
          kubernetes_sd_configs:
            - role: pod
              kubeconfig_file: ""
              follow_redirects: true
              selectors:
                - role: pod
                  field: spec.nodeName=%{NODE_NAME}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: collector
  namespace: {{ .Env.BENCH_NAME }}
  labels:
    benchmark: {{ .Env.BENCH_NAME }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: collector
  template:
    metadata:
      labels:
        app: collector
        app.kubernetes.io/name: collector
        benchmark: {{ .Env.BENCH_NAME }}
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      serviceAccountName: collector
      automountServiceAccountToken: true
      containers:
      - name: vmagent
        image: victoriametrics/vmagent:v1.156.0@sha256:d3229ab469c54ae5266e86246932266bad29b06668b5371acbd6d3de1b3035e7
        args:
        - -promscrape.config=/prometheus/config/config.yaml
        - -promscrape.config.strictParse=false
        - -enableMetadata=true
        - -remoteWrite.url=https://telemetry.googleapis.com/v1/metrics
        - -remoteWrite.forcePromProto=true
        - -remoteWrite.maxRowsPerBlock=200
        - -remoteWrite.tmpDataPath=/prometheus/data
        - -httpListenAddr=:8429
        ports:
        - name: vmagent-ins
          containerPort: 8429
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        resources:
          limits:
            memory: 3G
          requests:
            cpu: 4m
            memory: 32M
        volumeMounts:
        - name: storage
          mountPath: /prometheus/data
        - name: config
          readOnly: true
          mountPath: /prometheus/config
        livenessProbe:
          httpGet:
            port: 8429
            path: /health
            scheme: HTTP
        readinessProbe:
          httpGet:
            port: 8429
            path: /health
            scheme: HTTP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - all
          privileged: false
      volumes:
      - name: storage
        emptyDir: {}
      - name: config
        configMap:
          name: collector
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - arm64
                - amd64
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      tolerations:
      - effect: NoExecute
        operator: Exists
      - effect: NoSchedule
        operator: Exists
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        role: {{ .Env.BENCH_NAME }}-work
