apiVersion: v1
kind: ServiceAccount
metadata:
  name: collector
  namespace: {{ .Env.BENCH_NAME }}
  annotations:
    iam.gke.io/gcp-service-account: gmp-prombench@{{ .Env.PROJECT_ID }}.iam.gserviceaccount.com
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Env.BENCH_NAME }}:collector
rules:
- resources:
  - endpoints
  - nodes
  - nodes/metrics
  - pods
  - services
  apiGroups: [""]
  verbs: ["get", "list", "watch"]
- resources:
  - configmaps
  apiGroups: [""]
  verbs: ["get"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Env.BENCH_NAME }}:collector
roleRef:
  name: {{ .Env.BENCH_NAME }}:collector
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
subjects:
- name: collector
  namespace: {{ .Env.BENCH_NAME }}
  kind: ServiceAccount
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: collector
  namespace: {{ .Env.BENCH_NAME }}
data:
  config.yaml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
    scrape_configs:
        - job_name: PodMonitoring/gmp/avalanche/metrics
          honor_timestamps: true
          honor_labels: false
          no_stale_markers: false
          scrape_interval: 15s
          scrape_timeout: 10s
          metrics_path: /metrics
          follow_redirects: true
          relabel_configs:
            - source_labels: [__meta_kubernetes_namespace]
              regex: {{ .Env.BENCH_NAME }}
              action: keep
            - source_labels: [__meta_kubernetes_pod_label_app]
              regex: avalanche
              action: keep
            - source_labels: [__meta_kubernetes_pod_phase]
              regex: (Failed|Succeeded)
              action: drop
            - source_labels: [__meta_kubernetes_pod_container_port_name]
              regex: metrics
              action: keep
            - target_label: job
              replacement: avalanche
              action: replace
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: __tmp_instance
              action: replace
            - source_labels: [__meta_kubernetes_pod_controller_kind, __meta_kubernetes_pod_node_name]
              regex: DaemonSet;(.*)
              target_label: __tmp_instance
              replacement: $1
              action: replace
            - source_labels: [__tmp_instance, __meta_kubernetes_pod_container_port_name]
              regex: (.+);(.+)
              target_label: instance
              replacement: $1:$2
              action: replace
            - source_labels: [__meta_kubernetes_namespace]
              target_label: "k8s.namespace.name"
              action: replace
            - source_labels: [__meta_kubernetes_pod_label_app]
              target_label: "k8s.deployment.name"
              action: replace
            - source_labels: [__meta_kubernetes_pod_container_name]
              target_label: "k8s.container.name"
              action: replace
            - source_labels: [__address__]
              regex: '([^:]+):.*'
              target_label: "server.address"
              replacement: "$1"
              action: replace
            - source_labels: [__meta_kubernetes_pod_container_port_number]
              target_label: "server.port"
              action: replace
            - source_labels: [__scheme__]
              target_label: "url.scheme"
              action: replace
            - target_label: "gcp.project_id"
              replacement: "{{ .Env.PROJECT_ID }}"
              action: replace
            - target_label: "cloud.account.id"
              replacement: "{{ .Env.PROJECT_ID }}"
              action: replace
            - target_label: "cloud.availability_zone"
              replacement: "{{ .Env.ZONE }}"
              action: replace
            - target_label: "cloud.platform"
              replacement: "gcp_kubernetes_engine"
              action: replace
            - target_label: "cloud.provider"
              replacement: "gcp"
              action: replace
            - source_labels: [__meta_kubernetes_pod_label_topology_kubernetes_io_region]
              target_label: "cloud.region"
              action: replace
            - target_label: "host.id"
              replacement: "6738547723285439597"
              action: replace
            - source_labels: [__meta_kubernetes_pod_node_name]
              target_label: "host.name"
              action: replace
            - target_label: "host.type"
              replacement: "n2-highmem-8"
              action: replace
            - target_label: "k8s.cluster.name"
              replacement: "{{ .Env.CLUSTER_NAME }}"
              action: replace
            - source_labels: [__meta_kubernetes_pod_node_name]
              target_label: "k8s.node.name"
              action: replace
            - source_labels: [__meta_kubernetes_pod_name]
              target_label: "k8s.pod.name"
              action: replace
            - source_labels: [__meta_kubernetes_pod_uid]
              target_label: "k8s.pod.uid"
              action: replace
            - target_label: "k8s.pod.start_time"
              replacement: "2026-11-04T17:20:00Z"
              action: replace
            - source_labels: [__meta_kubernetes_pod_controller_name]
              target_label: "k8s.replicaset.name"
              action: replace
          metric_relabel_configs:
            - source_labels: ["k8s.pod.name"]
              target_label: "pod"
            - source_labels: ["k8s.container.name"]
              target_label: "container"
            - source_labels: ["k8s.deployment.name"]
              target_label: "top_level_controller_name"
            - target_label: "top_level_controller_type"
              replacement: "Deployment"
            - target_label: "otel_scope_name"
              replacement: "github.com/open-telemetry/opentelemetry-collector-contrib/receiver/prometheusreceiver"
            - target_label: "otel_scope_version"
              replacement: "0.163.1"
            - source_labels: ["gcp.project_id"]
              target_label: "exported_project_id"
            - source_labels: ["cloud.availability_zone"]
              target_label: "exported_location"
            - source_labels: ["k8s.cluster.name"]
              target_label: "exported_cluster"
            - source_labels: ["k8s.namespace.name"]
              target_label: "exported_namespace"
            - source_labels: ["job"]
              target_label: "exported_job"
            - source_labels: ["instance"]
              target_label: "exported_instance"
          kubernetes_sd_configs:
            - role: pod
              kubeconfig_file: ""
              follow_redirects: true
              selectors:
                - role: pod
                  field: spec.nodeName=%{NODE_NAME}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: collector
  namespace: {{ .Env.BENCH_NAME }}
  labels:
    benchmark: {{ .Env.BENCH_NAME }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: collector
  template:
    metadata:
      labels:
        app: collector
        app.kubernetes.io/name: collector
        benchmark: {{ .Env.BENCH_NAME }}
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      serviceAccountName: collector
      automountServiceAccountToken: true
      containers:
      - name: vmagent
        image: victoriametrics/vmagent:v1.156.0@sha256:d3229ab469c54ae5266e86246932266bad29b06668b5371acbd6d3de1b3035e7
        args:
        - -promscrape.config=/prometheus/config/config.yaml
        - -promscrape.config.strictParse=false
        - -promscrape.noStaleMarkers=false
        - -promscrape.streamParse=false
        - -enableMetadata=true
        - -remoteWrite.url=https://telemetry.googleapis.com/v1/metrics
        - -remoteWrite.forcePromProto=true
        - -remoteWrite.maxRowsPerBlock=200
        - -remoteWrite.tmpDataPath=/prometheus/data
        - -httpListenAddr=:8429
        ports:
        - name: vmagent-ins
          containerPort: 8429
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        resources:
          limits:
            memory: 3G
          requests:
            cpu: 4m
            memory: 32M
        volumeMounts:
        - name: storage
          mountPath: /prometheus/data
        - name: config
          readOnly: true
          mountPath: /prometheus/config
        livenessProbe:
          httpGet:
            port: 8429
            path: /health
            scheme: HTTP
        readinessProbe:
          httpGet:
            port: 8429
            path: /health
            scheme: HTTP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - all
          privileged: false
      volumes:
      - name: storage
        emptyDir: {}
      - name: config
        configMap:
          name: collector
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - arm64
                - amd64
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      tolerations:
      - effect: NoExecute
        operator: Exists
      - effect: NoSchedule
        operator: Exists
      securityContext:
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        role: {{ .Env.BENCH_NAME }}-work
